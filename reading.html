        .reading-section + .reading-section {

        .reading-item + .reading-item {

        .reading-item {

        .reading-heading {

    <!--
    ==========================================================================
    HOW TO ADD AN ITEM
    ==========================================================================
    Add one object to the READING array below (order does not matter):

        {
            title: "Title",
            author: "Author or studio",                   // optional
            type: "book",                                 // "book" | "paper" | "anime" | "other"
            status: "finished",                           // "reading" | "finished" | "want"
            year: 2026,                                   // year finished (optional, used for "finished")
            note: "",                                     // optional one-line thought
            link: ""                                      // optional URL; makes the title a link
        },

    Sections: Currently reading, Finished (grouped by year, newest first;
    items without a year go under "Earlier"), Want to read. Empty sections
    are hidden automatically.

    The entry marked `template: true` is an example only. It is hidden from
    normal visitors and appears only at reading.html?preview (to check the
    layout). Delete it or leave it; it never shows without ?preview.
    ==========================================================================
    -->
    <script>
        const READING = [
            {
                template: true, // EXAMPLE ONLY: rendered only with ?preview
                title: "Example Book Title (template entry)",
                author: "Example Author",
                type: "book",
                status: "finished",
                year: 2026,
                note: "Example one-line thought (replace with a real one).",
                link: ""
            }
        ];

        (function renderReadingList() {
            const SECTIONS = [
                ["reading", "Currently reading"],
                ["finished", "Finished"],
                ["want", "Want to read"]
            ];
            const TYPES = { book: "Book", paper: "Paper", anime: "Anime", other: "Other" };
            const preview = new URLSearchParams(window.location.search).has("preview");
            const list = document.getElementById("reading-list");
            const intro = document.getElementById("reading-intro");

            const escapeHtml = (value) => String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

            const safeUrl = (value) => {
                const url = String(value || "").trim();
                return /^(https?:)?\/\//i.test(url) || /^[./]/.test(url) ? url : "";
            };

            const items = READING.filter((item) => preview || !item.template);
            if (!items.length) {
                return; // clean empty state: only the intro line is shown
            }

            intro.textContent = "Books, papers, and anime I'm reading, have finished, or want to get to.";

            const renderItem = (item) => {
                const type = TYPES[item.type] || TYPES.other;
                const link = safeUrl(item.link);
                const title = link
                    ? `<a class="reading-title" href="${escapeHtml(link)}" target="_blank" rel="noopener noreferrer">${escapeHtml(item.title)}</a>`
                    : `<span class="reading-title">${escapeHtml(item.title)}</span>`;
                return `
                    <li class="reading-item">
                        ${item.template ? '<span class="reading-template-badge">Example entry – replace with a real item</span>' : ""}
                        <p class="reading-heading">${title}<span class="reading-type">${type}</span></p>
                        ${item.author ? `<p class="reading-author">${escapeHtml(item.author)}</p>` : ""}
                        ${item.note ? `<p class="reading-note">${escapeHtml(item.note)}</p>` : ""}
                    </li>`;
            };

            const byTitle = (a, b) => String(a.title).localeCompare(String(b.title));

            const html = SECTIONS.map(([status, label]) => {
                const group = items.filter((item) => item.status === status);
                if (!group.length) return "";
                let body;
                if (status === "finished") {
                    const byYear = new Map();
                    group.forEach((item) => {
                        const year = Number(item.year) || 0;
                        if (!byYear.has(year)) byYear.set(year, []);
                        byYear.get(year).push(item);
                    });
                    body = [...byYear.keys()].sort((a, b) => b - a).map((year) => `
                <h3 class="reading-year">${year || "Earlier"}</h3>
                <ul class="reading-list">${byYear.get(year).slice().sort(byTitle).map(renderItem).join("")}
                </ul>`).join("");
                } else {
                    body = `
                <ul class="reading-list">${group.slice().sort(byTitle).map(renderItem).join("")}
                </ul>`;
                }
                return `
            <div class="reading-section">
                <h2>${label}</h2>${body}
            </div>`;
            }).join("");

            if (!html.trim()) {
                return;
            }
            list.innerHTML = html;
            list.hidden = false;
        })();
    </script>
