    <title>Page not found | Yang</title>

    <style>
        /* Page-specific styles for 404.html. Links are root-relative because
         * GitHub Pages serves this page for any missing URL, at any depth.
         * The page is short, so the body becomes a column that pins the
         * footer to the bottom and centres the card in the remaining space. */
        .not-found-body {
            display: flex;
            flex-direction: column;
        }

        .not-found-page {
            display: flex;
            flex: 1;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin: 0 auto;
        }

        .not-found-card {
            width: min(100%, 640px);
            padding: 48px 45px;
            text-align: center;
            background: var(--surface);
            backdrop-filter: blur(16px) saturate(115%);
            -webkit-backdrop-filter: blur(16px) saturate(115%);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .not-found-code {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .not-found-card h1 {
            margin: 0;
            color: var(--ink);
            font-family: var(--serif);
            font-size: clamp(2.25rem, calc(2rem + 1.25vw), 3rem);
            font-weight: 500;
            line-height: 1.08;
            letter-spacing: -0.025em;
            text-wrap: balance;
        }

        .not-found-card > p {
            width: min(100%, 480px);
            margin: 18px auto 0;
            color: var(--muted);
            font-size: 17px;
            line-height: 1.65;
        }

        .not-found-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
        }

        @media (max-width: 680px) {
            .not-found-card {
                padding: 34px 24px;
            }

            .not-found-card > p {
                font-size: 16px;
            }
        }
    </style>
</head>

            <p>
                The page you are looking for has moved, been renamed, or never existed.
                Notes get reorganised from time to time, so the link may simply be out of date.
            </p>
            <div class="not-found-links">
                <a href="/index.html" class="button button-primary">Back to home</a>
                <a href="/notes.html" class="button button-secondary">Browse notes</a>
                <a href="/articles.html" class="button button-secondary">Read articles</a>
            </div>
        </section>
    </main>
