    <style>
        /* Page-specific styles for publications.html (reuses the shared surface tokens). */
        .pubs-page {
            width: min(100%, 980px);
            margin: 72px auto 100px;
        }

        .pubs-intro {
            margin: 18px auto 0;
            color: rgba(0, 0, 0, 0.66);
            font-size: 18px;
            line-height: 1.65;
        }

        .pubs-panel {
            padding: 36px 45px;
            background: var(--surface);
            backdrop-filter: blur(16px) saturate(115%);
            -webkit-backdrop-filter: blur(16px) saturate(115%);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .pubs-panel[hidden] {
            display: none;
        }

        .pubs-year + .pubs-year {
            margin-top: 34px;
            padding-top: 30px;
            border-top: 1px solid var(--line);
        }

        .pubs-year h2 {
            margin: 0 0 18px;
            color: #355f62;
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 400;
        }

        .pubs-list {
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: pub;
        }

        .pubs-entry {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 6px;
            counter-increment: pub;
        }

        .pubs-entry + .pubs-entry {
            margin-top: 24px;
        }

        .pubs-entry::before {
            content: counter(pub) ".";
            padding-top: 1px;
            color: #527376;
            font-family: var(--serif);
            font-size: 18px;
        }

        .pubs-body {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .pubs-title {
            margin: 0;
            color: var(--ink);
            font-size: 17px;
            font-weight: 700;
            line-height: 1.45;
        }

        .pubs-authors,
        .pubs-venue,
        .pubs-note {
            margin: 4px 0 0;
            font-size: 15px;
            line-height: 1.55;
        }

        .pubs-authors {
            color: rgba(0, 0, 0, 0.72);
        }

        .pubs-authors strong {
            color: var(--ink);
        }

        .pubs-venue {
            color: var(--muted);
            font-style: italic;
        }

        .pubs-note {
            color: #9a3412;
            font-weight: 700;
        }

        .pubs-template-badge {
            display: inline-block;
            margin-bottom: 6px;
            padding: 3px 10px;
            color: #7c2d12;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: rgba(254, 243, 199, 0.85);
            border: 1px dashed #d97706;
            border-radius: 999px;
        }

        .pubs-links {
            display: flex;
            margin-top: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pubs-links a,
        .pubs-abs-toggle {
            padding: 3px 11px;
            color: var(--accent-strong);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-decoration: none;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.48);
            border: 1px solid rgba(23, 95, 112, 0.45);
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .pubs-links a:hover,
        .pubs-abs-toggle:hover,
        .pubs-abs-toggle[aria-expanded="true"] {
            color: #ffffff;
            background: var(--accent);
        }

        .pubs-abs-toggle {
            margin: 0;
            font-family: inherit;
            line-height: inherit;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .pubs-links a:focus-visible,
        .pubs-abs-toggle:focus-visible {
            outline: 2px solid var(--accent-strong);
            outline-offset: 2px;
        }

        /* Collapsible abstract: animates grid row 0fr -> 1fr for a smooth expand. */
        .pubs-abstract {
            display: grid;
            grid-template-rows: 0fr;
            visibility: hidden;
            transition: grid-template-rows 0.32s ease, visibility 0s linear 0.32s;
        }

        .pubs-abstract.is-open {
            grid-template-rows: 1fr;
            visibility: visible;
            transition: grid-template-rows 0.32s ease, visibility 0s linear 0s;
        }

        .pubs-abstract-inner {
            min-height: 0;
            overflow: hidden;
        }

        .pubs-abstract-box {
            max-width: 72ch;
            margin: 12px 0 2px;
            padding: 14px 18px;
            color: rgba(0, 0, 0, 0.74);
            font-size: 15px;
            line-height: 1.65;
            text-align: left;
            hyphens: auto;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--line);
            border-left: 3px solid rgba(23, 95, 112, 0.55);
            border-radius: 12px;
        }

        .pubs-abstract-box p {
            margin: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .pubs-abstract,
            .pubs-abstract.is-open {
                transition: none;
            }
        }

        @media (max-width: 900px) {
            .pubs-page {
                margin-top: 48px;
            }
        }

        @media (max-width: 680px) {
            .pubs-page {
                margin-top: 34px;
                margin-bottom: 64px;
            }

            .pubs-panel {
                padding: 26px 20px;
            }

            .pubs-intro {
                font-size: 16px;
            }

            .pubs-year h2 {
                font-size: 26px;
            }

            .pubs-entry {
                grid-template-columns: 30px minmax(0, 1fr);
            }

            .pubs-abstract-box {
                padding: 12px 14px;
                font-size: 14.5px;
            }
        }
    </style>

    <!--
    ==========================================================================
    HOW TO ADD A PUBLICATION
    ==========================================================================
    Add one object to the PUBLICATIONS array below (order does not matter):

        {
            title: "Paper title",
            authors: "Yang Xu, Coauthor A, Coauthor B",   // "Yang Xu" is bolded automatically
            venue: "Journal or Conference Name, City",    // shown in italics, followed by "Month Year"
            year: 2027,
            month: 5,                                     // 1-12, or 0 if unknown
            note: "",                                     // optional highlight, e.g. "Best Paper Award"
            abstract: "",                                 // optional; non-empty adds an "ABS" toggle button
            links: { arxiv: "", pdf: "", doi: "", code: "", scholar: "" }  // empty = button hidden
        },

    Entries are grouped under year headings (newest first), numbered within
    each year, and sorted by month (newest first).

    The entry marked `template: true` is an example only. It is hidden from
    normal visitors and appears only at publications.html?preview (to check
    the layout). Delete it or leave it; it never shows without ?preview.
    ==========================================================================
    -->
    <script>
        const PUBLICATIONS = [
            {
                template: true, // EXAMPLE ONLY: rendered only with ?preview
                title: "Example Paper Title (template entry)",
                authors: "Yang Xu, Coauthor A, Coauthor B",
                venue: "Journal Name",
                year: 2026,
                month: 1,
                note: "Example note line (e.g. Best Paper Award)",
                abstract: "This is an example abstract for the template entry. Replace it with the real abstract of the paper when adding a publication. It appears in a collapsible box when the ABS button is clicked.",
                links: { arxiv: "https://arxiv.org/", pdf: "", doi: "", code: "https://github.com/jasonxu-cell", scholar: "" }
            }
        ];

        (function renderPublications() {
            const OWN_NAME = "Yang Xu";
            const MONTHS = ["", "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            const BUTTONS = [
                ["arxiv", "arXiv"], ["pdf", "PDF"], ["doi", "DOI"], ["code", "Code"], ["scholar", "Scholar"]
            ];
            const preview = new URLSearchParams(window.location.search).has("preview");
            const list = document.getElementById("pubs-list");
            const intro = document.getElementById("pubs-intro");

            const escapeHtml = (value) => String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

            const formatAuthors = (authors) => String(authors || "")
                .split(",")
                .map((name) => name.trim())
                .filter(Boolean)
                .map((name) => {
                    const safe = escapeHtml(name);
                    return name.replace(/[*†‡#]+$/, "").trim() === OWN_NAME ? `<strong>${safe}</strong>` : safe;
                })
                .join(", ");

            const entries = PUBLICATIONS.filter((pub) => preview || !pub.template);
            if (!entries.length) {
                return; // clean empty state: only the intro line is shown
            }

            intro.textContent = "Publications in reverse chronological order.";

            const byYear = new Map();
            entries.forEach((pub) => {
                const year = Number(pub.year) || 0;
                if (!byYear.has(year)) byYear.set(year, []);
                byYear.get(year).push(pub);
            });

            let absCount = 0;
            const html = [...byYear.keys()].sort((a, b) => b - a).map((year) => {
                const items = byYear.get(year)
                    .slice()
                    .sort((a, b) => (Number(b.month) || 0) - (Number(a.month) || 0))
                    .map((pub) => {
                        const month = MONTHS[Number(pub.month)] || "";
                        const when = [month, year || ""].filter(Boolean).join(" ");
                        const venue = [pub.venue, when].filter(Boolean).join(", ");
                        const links = BUTTONS
                            .filter(([key]) => pub.links && String(pub.links[key] || "").trim())
                            .map(([key, label]) => `<a href="${escapeHtml(pub.links[key].trim())}" target="_blank" rel="noopener noreferrer">${label}</a>`)
                            .join("");
                        const abstract = String(pub.abstract || "").trim();
                        const absId = abstract ? `pub-abstract-${++absCount}` : "";
                        const absButton = abstract
                            ? `<button type="button" class="pubs-abs-toggle" aria-expanded="false" aria-controls="${absId}">Abs</button>`
                            : "";
                        const buttons = absButton + links;
                        return `
                <li class="pubs-entry">
                    <div class="pubs-body">
                        ${pub.template ? '<span class="pubs-template-badge">Example entry – replace with a real publication</span>' : ""}
                        <p class="pubs-title">${escapeHtml(pub.title)}</p>
                        ${pub.authors ? `<p class="pubs-authors">${formatAuthors(pub.authors)}</p>` : ""}
                        ${venue ? `<p class="pubs-venue">${escapeHtml(venue)}</p>` : ""}
                        ${pub.note ? `<p class="pubs-note">${escapeHtml(pub.note)}</p>` : ""}
                        ${buttons ? `<div class="pubs-links">${buttons}</div>` : ""}
                        ${abstract ? `<div class="pubs-abstract" id="${absId}" role="region" aria-label="Abstract"><div class="pubs-abstract-inner"><div class="pubs-abstract-box"><p>${escapeHtml(abstract)}</p></div></div></div>` : ""}
                    </div>
                </li>`;
                    }).join("");
                return `
            <div class="pubs-year">
                <h2>${year || "Undated"}</h2>
                <ol class="pubs-list">${items}
                </ol>
            </div>`;
            }).join("");

            list.innerHTML = html;
            list.hidden = false;

            list.addEventListener("click", (event) => {
                const button = event.target.closest(".pubs-abs-toggle");
                if (!button) return;
                const panel = document.getElementById(button.getAttribute("aria-controls"));
                if (!panel) return;
                const open = button.getAttribute("aria-expanded") !== "true";
                button.setAttribute("aria-expanded", String(open));
                panel.classList.toggle("is-open", open);
            });
        })();
    </script>
