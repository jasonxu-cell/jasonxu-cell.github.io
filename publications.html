    <style>
        /* Page-specific styles for publications.html (reuses the shared surface tokens). */
        .pubs-page {
            width: min(100%, 980px);
            margin: 72px auto 100px;
        }

        .pubs-intro {
            margin: 18px auto 0;
            color: rgba(0, 0, 0, 0.66);
            font-size: 18px;
            line-height: 1.65;
        }

        .pubs-panel {
            padding: 36px 45px;
            background: var(--surface);
            backdrop-filter: blur(16px) saturate(115%);
            -webkit-backdrop-filter: blur(16px) saturate(115%);
            border: 1px solid var(--surface-border);
            border-radius: 24px;
            box-shadow: var(--shadow);
        }

        .pubs-panel[hidden] {
            display: none;
        }

        .pubs-year[hidden],
        .pubs-entry[hidden] {
            display: none;
        }

        /* Separator only between visible year groups (search can hide some). */
        .pubs-year:not([hidden]) ~ .pubs-year:not([hidden]) {
            margin-top: 34px;
            padding-top: 30px;
            border-top: 1px solid var(--line);
        }

        .pubs-year h2 {
            margin: 0 0 18px;
            color: #355f62;
            font-family: var(--serif);
            font-size: 30px;
            font-weight: 400;
        }

        .pubs-list {
            margin: 0;
            padding: 0;
            list-style: none;
            counter-reset: pub;
        }

        .pubs-entry {
            display: grid;
            grid-template-columns: 42px minmax(0, 1fr);
            gap: 6px;
            counter-increment: pub;
        }

        .pubs-entry + .pubs-entry {
            margin-top: 24px;
        }

        .pubs-entry::before {
            content: counter(pub) ".";
            padding-top: 1px;
            color: #527376;
            font-family: var(--serif);
            font-size: 18px;
        }

        .pubs-body {
            min-width: 0;
            overflow-wrap: anywhere;
        }

        .pubs-title {
            margin: 0;
            color: var(--ink);
            font-size: 17px;
            font-weight: 700;
            line-height: 1.45;
        }

        .pubs-authors,
        .pubs-venue,
        .pubs-note {
            margin: 4px 0 0;
            font-size: 15px;
            line-height: 1.55;
        }

        .pubs-authors {
            color: rgba(0, 0, 0, 0.72);
        }

        .pubs-authors strong {
            color: var(--ink);
        }

        .pubs-venue {
            color: var(--muted);
            font-style: italic;
        }

        .pubs-note {
            color: #9a3412;
            font-weight: 700;
        }

        .pubs-template-badge {
            display: inline-block;
            margin-bottom: 6px;
            padding: 3px 10px;
            color: #7c2d12;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.02em;
            background: rgba(254, 243, 199, 0.85);
            border: 1px dashed #d97706;
            border-radius: 999px;
        }

        .pubs-links {
            display: flex;
            margin-top: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .pubs-links a,
        .pubs-abs-toggle {
            padding: 3px 11px;
            color: var(--accent-strong);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-decoration: none;
            text-transform: uppercase;
            background: rgba(255, 255, 255, 0.48);
            border: 1px solid rgba(23, 95, 112, 0.45);
            border-radius: 999px;
            transition: color 0.2s ease, background 0.2s ease;
        }

        .pubs-links a:hover,
        .pubs-abs-toggle:hover,
        .pubs-abs-toggle[aria-expanded="true"] {
            color: #ffffff;
            background: var(--accent);
        }

        .pubs-abs-toggle {
            margin: 0;
            font-family: inherit;
            line-height: inherit;
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
        }

        .pubs-links a:focus-visible,
        .pubs-abs-toggle:focus-visible {
            outline: 2px solid var(--accent-strong);
            outline-offset: 2px;
        }

        /* Collapsible abstract: animates grid row 0fr -> 1fr for a smooth expand. */
        .pubs-abstract {
            display: grid;
            grid-template-rows: 0fr;
            visibility: hidden;
            transition: grid-template-rows 0.32s ease, visibility 0s linear 0.32s;
        }

        .pubs-abstract.is-open {
            grid-template-rows: 1fr;
            visibility: visible;
            transition: grid-template-rows 0.32s ease, visibility 0s linear 0s;
        }

        .pubs-abstract-inner {
            min-height: 0;
            overflow: hidden;
        }

        .pubs-abstract-box {
            max-width: 72ch;
            margin: 12px 0 2px;
            padding: 14px 18px;
            color: rgba(0, 0, 0, 0.74);
            font-size: 15px;
            line-height: 1.65;
            text-align: left;
            hyphens: auto;
            background: rgba(255, 255, 255, 0.5);
            border: 1px solid var(--line);
            border-left: 3px solid rgba(23, 95, 112, 0.55);
            border-radius: 12px;
        }

        .pubs-abstract-box p {
            margin: 0;
        }

        @media (prefers-reduced-motion: reduce) {
            .pubs-abstract,
            .pubs-abstract.is-open {
                transition: none;
            }
        }


        /* ---------- Search (same look as the Notes page search box) ---------- */

        .pubs-search {
            width: min(100%, 760px);
            margin: 0 auto clamp(32px, 4vw, 44px);
        }

        .pubs-search[hidden] {
            display: none;
        }

        .pubs-search-field {
            position: relative;
        }

        .pubs-search-field svg {
            position: absolute;
            top: 50%;
            left: 20px;
            width: 18px;
            height: 18px;
            color: var(--muted);
            transform: translateY(-50%);
            pointer-events: none;
            z-index: 1;
        }

        .pubs-search-input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 56px 14px 50px;
            color: var(--ink);
            font: inherit;
            font-size: 17px;
            background: var(--surface);
            backdrop-filter: blur(16px) saturate(115%);
            -webkit-backdrop-filter: blur(16px) saturate(115%);
            border: 1px solid var(--surface-border);
            border-radius: 999px;
            box-shadow: var(--shadow);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .pubs-search-input::placeholder {
            color: rgba(20, 33, 38, 0.5);
        }

        .pubs-search-input:focus {
            background: var(--surface-hover);
            border-color: rgba(23, 95, 112, 0.45);
            box-shadow: var(--shadow), 0 0 0 3px rgba(23, 95, 112, 0.16);
        }

        .pubs-search-input::-webkit-search-cancel-button {
            cursor: pointer;
        }

        .pubs-search-status {
            margin: 12px 6px 0;
            color: var(--muted);
            font-size: 14px;
        }

        .pubs-search-status:empty {
            display: none;
        }

        .pubs-search-status.is-empty {
            padding: 18px 22px;
            color: var(--muted);
            font-size: 15px;
            text-align: center;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 18px;
        }

        .pubs-search-label {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        .pubs-body mark {
            padding: 0;
            color: inherit;
            background: rgba(250, 204, 21, 0.42);
            border-radius: 3px;
        }

        .pubs-match-snippet {
            max-width: 72ch;
            margin: 8px 0 0;
            color: rgba(0, 0, 0, 0.7);
            font-size: 14.5px;
            line-height: 1.6;
        }

        .pubs-match-label {
            margin-right: 6px;
            color: var(--accent-strong);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        @media (max-width: 900px) {
            .pubs-page {
                margin-top: 48px;
            }
        }

        @media (max-width: 680px) {
            .pubs-page {
                margin-top: 34px;

            .pubs-panel {

            .pubs-intro {

            .pubs-year h2 {

            .pubs-entry {
                grid-template-columns: 30px minmax(0, 1fr);
            }

            .pubs-search-input {
                padding: 12px 18px 12px 44px;
                font-size: 16px;
            }

            .pubs-search-field svg {
                left: 16px;
            }

            .pubs-abstract-box {
                padding: 12px 14px;
                font-size: 14.5px;
            }
        }
    </style>

    <!--
    ==========================================================================
    HOW TO ADD A PUBLICATION
    ==========================================================================
    Add one object to the PUBLICATIONS array below (order does not matter):

        {
            title: "Paper title",
            authors: "Yang, Coauthor A, Coauthor B",   // "Yang" is bolded automatically
            venue: "Journal or Conference Name, City",    // shown in italics, followed by "Month Year"
            year: 2027,
            month: 5,                                     // 1-12, or 0 if unknown
            note: "",                                     // optional highlight, e.g. "Best Paper Award"
            abstract: "",                                 // optional; non-empty adds an "ABS" toggle button
            links: { arxiv: "", pdf: "", doi: "", code: "", scholar: "" }  // empty = button hidden
        },

    Entries are grouped under year headings (newest first), numbered within
    each year, and sorted by month (newest first).

    The entry marked `template: true` is an example only. It is hidden from
    normal visitors and appears only at publications.html?preview (to check
    the layout). Delete it or leave it; it never shows without ?preview.
    ==========================================================================
    -->
    <script>
        const PUBLICATIONS = [
            {
                template: true, // EXAMPLE ONLY: rendered only with ?preview
                title: "Example Paper Title (template entry)",
                authors: "Yang, Coauthor A, Coauthor B",
                venue: "Journal Name",
                year: 2026,
                month: 1,
                note: "Example note line (e.g. Best Paper Award)",
                abstract: "This is an example abstract for the template entry. Replace it with the real abstract of the paper when adding a publication. It appears in a collapsible box when the ABS button is clicked.",
                links: { arxiv: "https://arxiv.org/", pdf: "", doi: "", code: "https://github.com/jasonxu-cell", scholar: "" }
            }
        ];

        (function renderPublications() {
            const OWN_NAME = "Yang";
            const MONTHS = ["", "January", "February", "March", "April", "May", "June",
                "July", "August", "September", "October", "November", "December"];
            const BUTTONS = [
                ["arxiv", "arXiv"], ["pdf", "PDF"], ["doi", "DOI"], ["code", "Code"], ["scholar", "Scholar"]
            ];
            const preview = new URLSearchParams(window.location.search).has("preview");
            const list = document.getElementById("pubs-list");
            const intro = document.getElementById("pubs-intro");

            const escapeHtml = (value) => String(value == null ? "" : value)
                .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;").replace(/'/g, "&#39;");

            const escapeRegExp = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

            // Escapes text and wraps every occurrence of the search terms in <mark>.
            const highlight = (value, terms) => {
                const text = String(value == null ? "" : value);
                if (!terms || !terms.length) return escapeHtml(text);
                const pattern = new RegExp("(" + terms.map(escapeRegExp).sort((a, b) => b.length - a.length).join("|") + ")", "gi");
                return text.split(pattern).map((part, i) => (i % 2 ? `<mark>${escapeHtml(part)}</mark>` : escapeHtml(part))).join("");
            };

            const formatAuthors = (authors, terms) => String(authors || "")
                .split(",")
                .map((name) => name.trim())
                .filter(Boolean)
                .map((name) => {
                    const safe = highlight(name, terms);
                    return name.replace(/[*†‡#]+$/, "").trim() === OWN_NAME ? `<strong>${safe}</strong>` : safe;
                })
                .join(", ");

            const entries = PUBLICATIONS.filter((pub) => preview || !pub.template);
            if (!entries.length) {
                return; // clean empty state: only the intro line is shown
            }

            intro.textContent = "Publications in reverse chronological order.";

            const byYear = new Map();
            entries.forEach((pub) => {
                const year = Number(pub.year) || 0;
                if (!byYear.has(year)) byYear.set(year, []);
                byYear.get(year).push(pub);
            });

            const venueText = (pub) => {
                const year = Number(pub.year) || 0;
                const month = MONTHS[Number(pub.month)] || "";
                const when = [month, year || ""].filter(Boolean).join(" ");
                return [pub.venue, when].filter(Boolean).join(", ");
            };

            let absCount = 0;
            const html = [...byYear.keys()].sort((a, b) => b - a).map((year) => {
                const items = byYear.get(year)
                    .slice()
                    .sort((a, b) => (Number(b.month) || 0) - (Number(a.month) || 0))
                    .map((pub) => {
                        const venue = venueText(pub);
                        const links = BUTTONS
                            .filter(([key]) => pub.links && String(pub.links[key] || "").trim())
                            .map(([key, label]) => `<a href="${escapeHtml(pub.links[key].trim())}" target="_blank" rel="noopener noreferrer">${label}</a>`)
                            .join("");
                        const abstract = String(pub.abstract || "").trim();
                        const absId = abstract ? `pub-abstract-${++absCount}` : "";
                        const absButton = abstract
                            ? `<button type="button" class="pubs-abs-toggle" aria-expanded="false" aria-controls="${absId}">Abs</button>`
                            : "";
                        const buttons = absButton + links;
                        return `
                <li class="pubs-entry" data-pub="${entries.indexOf(pub)}">
                    <div class="pubs-body">
                        ${pub.template ? '<span class="pubs-template-badge">Example entry – replace with a real publication</span>' : ""}
                        <p class="pubs-title">${escapeHtml(pub.title)}</p>
                        ${pub.authors ? `<p class="pubs-authors">${formatAuthors(pub.authors)}</p>` : ""}
                        ${venue ? `<p class="pubs-venue">${escapeHtml(venue)}</p>` : ""}
                        ${pub.note ? `<p class="pubs-note">${escapeHtml(pub.note)}</p>` : ""}
                        <p class="pubs-match-snippet" hidden></p>
                        ${buttons ? `<div class="pubs-links">${buttons}</div>` : ""}
                        ${abstract ? `<div class="pubs-abstract" id="${absId}" role="region" aria-label="Abstract"><div class="pubs-abstract-inner"><div class="pubs-abstract-box"><p>${escapeHtml(abstract)}</p></div></div></div>` : ""}
                    </div>
                </li>`;
                    }).join("");
                return `
            <div class="pubs-year">
                <h2>${year || "Undated"}</h2>
                <ol class="pubs-list">${items}
                </ol>
            </div>`;
            }).join("");

            list.innerHTML = html;
            list.hidden = false;

            list.addEventListener("click", (event) => {
                const button = event.target.closest(".pubs-abs-toggle");
                if (!button) return;
                const panel = document.getElementById(button.getAttribute("aria-controls"));
                if (!panel) return;
                const open = button.getAttribute("aria-expanded") !== "true";
                button.setAttribute("aria-expanded", String(open));
                panel.classList.toggle("is-open", open);
            });

            /* ---------- Search ---------- */

            const searchForm = document.getElementById("pubs-search");
            const searchInput = document.getElementById("pubs-search-input");
            const searchStatus = document.getElementById("pubs-search-status");
            const SNIPPET_RADIUS = 70;

            const searchable = entries.map((pub) => [
                pub.title, pub.authors, venueText(pub), pub.year, pub.note, pub.abstract
            ].map((part) => String(part == null ? "" : part)).join("\n").toLowerCase());

            const abstractSnippet = (abstract, terms) => {
                const lower = abstract.toLowerCase();
                const hits = terms.map((term) => lower.indexOf(term)).filter((i) => i >= 0);
                if (!hits.length) return "";
                const position = Math.min(...hits);
                let start = Math.max(0, position - SNIPPET_RADIUS);
                let end = Math.min(abstract.length, position + SNIPPET_RADIUS * 2);
                if (start > 0) {
                    const space = abstract.indexOf(" ", start);
                    if (space !== -1 && space < position) start = space + 1;
                }
                if (end < abstract.length) {
                    const space = abstract.lastIndexOf(" ", end);
                    if (space > position) end = space;
                }
                return (start > 0 ? "… " : "") + abstract.slice(start, end).trim() + (end < abstract.length ? " …" : "");
            };

            const applySearch = () => {
                const terms = [...new Set(searchInput.value.trim().toLowerCase().split(/\s+/).filter(Boolean))];
                let shown = 0;
                list.querySelectorAll(".pubs-entry").forEach((item) => {
                    const index = Number(item.dataset.pub);
                    const pub = entries[index];
                    const match = terms.every((term) => searchable[index].includes(term));
                    item.hidden = !match;
                    if (match) shown += 1;
                    const title = item.querySelector(".pubs-title");
                    const authors = item.querySelector(".pubs-authors");
                    const venue = item.querySelector(".pubs-venue");
                    const note = item.querySelector(".pubs-note");
                    const snippet = item.querySelector(".pubs-match-snippet");
                    if (title) title.innerHTML = highlight(pub.title, terms);
                    if (authors) authors.innerHTML = formatAuthors(pub.authors, terms);
                    if (venue) venue.innerHTML = highlight(venueText(pub), terms);
                    if (note) note.innerHTML = highlight(pub.note, terms);
                    const abstract = String(pub.abstract || "").trim();
                    const text = match && terms.length && abstract ? abstractSnippet(abstract, terms) : "";
                    snippet.hidden = !text;
                    snippet.innerHTML = text ? `<span class="pubs-match-label">Abstract</span>${highlight(text, terms)}` : "";
                });
                list.querySelectorAll(".pubs-year").forEach((group) => {
                    group.hidden = !group.querySelector(".pubs-entry:not([hidden])");
                });
                list.hidden = shown === 0;
                searchForm.classList.toggle("has-query", terms.length > 0);
                searchStatus.classList.toggle("is-empty", terms.length > 0 && shown === 0);
                searchStatus.textContent = !terms.length ? ""
                    : shown === 0 ? "No results."
                    : shown === 1 ? "1 publication found."
                    : `${shown} publications found.`;
            };

            let debounceTimer = 0;
            searchForm.hidden = false;
            searchForm.addEventListener("submit", (event) => event.preventDefault());
            searchInput.addEventListener("input", () => {
                window.clearTimeout(debounceTimer);
                debounceTimer = window.setTimeout(applySearch, 120);
            });
            searchInput.addEventListener("keydown", (event) => {
                if (event.key !== "Escape") return;
                if (searchInput.value) {
                    event.preventDefault();
                    searchInput.value = "";
                    applySearch();
                } else {
                    searchInput.blur();
                }
            });
            document.addEventListener("keydown", (event) => {
                if (event.key !== "/" || event.ctrlKey || event.metaKey || event.altKey) return;
                const target = event.target;
                const tag = target && target.tagName;
                if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (target && target.isContentEditable)) return;
                event.preventDefault();
                searchInput.focus();
                searchInput.select();
            });
        })();
    </script>
